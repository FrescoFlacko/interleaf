<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The isolated diagram renderer. This page is never shown and never
      navigated; it loads its own script and nothing else. `default-src 'none'`
      makes every category an explicit decision, and the only ones granted are
      the app's own script and the inline style the layout engine writes while
      measuring text.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'; frame-ancestors 'none'; media-src 'none'"
    />
    <title>Diagram renderer</title>
    <style>
      /* The staging element only has to be measurable, never visible. */
      body {
        margin: 0;
        background: transparent;
      }
      #stage {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
